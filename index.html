<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欧盟标签打印</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f766e'/%3E%3Cpath d='M20 20h24v6H20zm0 12h24v6H20zm0 12h16v6H20z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      --page-bg: #f3f5f7;
      --panel: #ffffff;
      --line: #d8dee4;
      --line-strong: #c3cbd3;
      --text: #1f2937;
      --muted: #667085;
      --accent: #0f766e;
      --accent-hover: #0b5f59;
      --accent-soft: #e6f3f1;
      --danger: #b42318;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 10px 28px rgba(16, 24, 40, .08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--page-bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app-header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .app-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .format-badge {
      flex: 0 0 auto;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      background: #fbfcfd;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .control-panel {
      padding: 20px;
    }

    .panel-title {
      margin: 0 0 18px;
      font-size: 15px;
      line-height: 1.3;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-of-type {
      margin-bottom: 0;
    }

    .field-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .field-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .input-shell {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 13px;
      color: var(--muted);
      pointer-events: none;
      transform: translateY(-50%);
    }

    .text-input,
    .number-input {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .text-input {
      height: 48px;
      padding: 0 14px 0 41px;
      font-size: 16px;
    }

    .text-input::placeholder {
      color: #98a2b3;
    }

    .number-input {
      height: 44px;
      padding: 0 8px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      -moz-appearance: textfield;
    }

    .number-input::-webkit-outer-spin-button,
    .number-input::-webkit-inner-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .text-input:focus,
    .number-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .13);
    }

    .stepper {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      gap: 8px;
    }

    .icon-button,
    .secondary-button {
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, color .15s ease;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      padding: 0;
    }

    .icon-button:hover,
    .secondary-button:hover {
      border-color: #98a2b3;
      background: #f8fafb;
    }

    .icon-button:focus-visible,
    .secondary-button:focus-visible,
    .primary-button:focus-visible {
      outline: 3px solid rgba(15, 118, 110, .18);
      outline-offset: 1px;
    }

    .action-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      gap: 10px;
      margin-top: 22px;
    }

    .primary-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }

    .primary-button:hover {
      background: var(--accent-hover);
    }

    .primary-button:active {
      transform: translateY(1px);
    }

    .secondary-button {
      width: 44px;
      height: 48px;
      padding: 0;
    }

    .calibration-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 40px;
      margin-top: 14px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }

    .calibration-button:hover {
      border-color: #98a2b3;
      background: #f8fafb;
    }

    .calibration-button:focus-visible {
      outline: 3px solid rgba(15, 118, 110, .18);
      outline-offset: 1px;
    }

    .divider {
      height: 1px;
      margin: 18px 0 0;
      border: 0;
      background: var(--line);
    }

    .small-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .small-note svg {
      flex: 0 0 auto;
      margin-top: 2px;
    }

    .preview-panel {
      min-width: 0;
      padding: 20px;
    }

    .preview-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .preview-heading h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
    }

    .preview-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .preview-board {
      display: grid;
      min-height: 540px;
      padding: 30px;
      place-items: center;
      border: 1px solid #d5dce2;
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, .25)),
        #e9edf0;
    }

    .preview-label.label-frame {
      position: relative;
      width: min(100%, 380px);
      aspect-ratio: 2 / 3;
      overflow: hidden;
      filter: drop-shadow(0 14px 30px rgba(16, 24, 40, .18));
    }

    .preview-label.label-frame > .label {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .label {
      --model-font-size: 2.8663cqw;
      --model-top: 7.393cqw;
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #fff;
      container-type: inline-size;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    .label-template-image {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .label-line {
      position: absolute;
      left: 17.185%;
      z-index: 2;
      overflow: hidden;
      font-size: 2.8663cqw;
      font-weight: 400;
      line-height: 1.318;
      white-space: pre;
    }

    .model-line {
      top: var(--model-top);
      right: 4%;
      font-size: var(--model-font-size);
    }

    .line-product-name {
      top: 3.611cqw;
    }

    .line-input {
      top: 11.174cqw;
    }

    .line-manufacturer-1 {
      top: 17.845cqw;
    }

    .line-manufacturer-2 {
      top: 21.627cqw;
    }

    .line-address-1 {
      top: 28.270cqw;
    }

    .line-address-2 {
      top: 32.052cqw;
    }

    .line-address-3 {
      top: 35.831cqw;
    }

    .line-address-4 {
      top: 39.612cqw;
    }

    .line-phone {
      top: 46.255cqw;
    }

    .line-eu-1 {
      top: 55.766cqw;
    }

    .line-eu-2 {
      top: 59.548cqw;
    }

    .line-eu-3 {
      top: 63.329cqw;
    }

    .line-email {
      top: 67.108cqw;
    }

    .line-made-in-china {
      left: 38.296%;
      top: 74.050cqw;
    }

    .print-root,
    .calibration-root {
      display: none;
    }

    @page {
      size: 100mm 150mm;
      margin: 0;
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .control-panel {
        order: 1;
      }

      .preview-panel {
        order: 2;
      }

      .preview-board {
        min-height: 440px;
        padding: 20px;
      }
    }

    @media (max-width: 560px) {
      .app-header-inner,
      .app-layout {
        padding-right: 16px;
        padding-left: 16px;
      }

      .app-header-inner {
        align-items: flex-start;
      }

      .format-badge {
        margin-top: 2px;
      }

      .preview-board {
        min-height: 0;
        padding: 14px;
      }

      .preview-label {
        width: min(100%, 310px);
      }
    }

    @media print {
      html,
      body {
        width: 100mm;
        min-height: 0;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .app-header,
      .app-layout {
        display: none !important;
      }

      .print-root {
        display: block !important;
      }

      .print-label {
        width: 100mm;
        height: 150mm;
        overflow: hidden;
        break-after: page;
        page-break-after: always;
      }

      .print-label:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      body.calibration-mode .print-root {
        display: none !important;
      }

      body.calibration-mode .calibration-root {
        display: block !important;
      }

      .calibration-page {
        position: relative;
        width: 100mm;
        height: 150mm;
        overflow: hidden;
        background: #fff;
        color: #000;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      .calibration-frame {
        position: absolute;
        inset: 5mm;
        border: .4mm solid #000;
      }

      .calibration-title {
        position: absolute;
        top: 28mm;
        left: 15mm;
        right: 15mm;
        text-align: center;
        font-size: 4.5mm;
        font-weight: 700;
        line-height: 1.25;
      }

      .calibration-subtitle {
        position: absolute;
        top: 47mm;
        left: 15mm;
        right: 15mm;
        text-align: center;
        font-size: 2.7mm;
        line-height: 1.5;
      }

      .calibration-size-box {
        position: absolute;
        top: 15mm;
        left: 12mm;
        width: 10mm;
        height: 10mm;
        border: .5mm solid #000;
      }

      .calibration-size-box span {
        position: absolute;
        top: 11mm;
        left: -2mm;
        width: 16mm;
        text-align: center;
        font-size: 2.1mm;
      }

      .calibration-tick {
        position: absolute;
        left: 5mm;
        width: 2.5mm;
        height: .25mm;
        background: #000;
        transform: translateY(-.125mm);
      }

      .calibration-tick.major {
        width: 5mm;
      }

      .calibration-tick.right {
        right: 5mm;
        left: auto;
      }

      .calibration-tick-label {
        position: absolute;
        left: 11mm;
        color: #000;
        font-size: 2.1mm;
        line-height: 1;
        transform: translateY(-50%);
      }

      .calibration-tick-label.right {
        right: 11mm;
        left: auto;
        text-align: right;
      }

      .calibration-cutoff {
        position: absolute;
        top: 100mm;
        right: 5mm;
        left: 5mm;
        border-top: .45mm dashed #000;
      }

      .calibration-cutoff span {
        position: absolute;
        top: -4.5mm;
        left: 50%;
        padding: 0 2mm;
        background: #fff;
        font-size: 2.5mm;
        font-weight: 700;
        line-height: 1;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .calibration-end {
        position: absolute;
        right: 15mm;
        bottom: 8mm;
        left: 15mm;
        padding-top: 2mm;
        border-top: .3mm solid #000;
        text-align: center;
        font-size: 2.6mm;
        font-weight: 700;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <path d="M6 9V2h12v7"/>
            <path d="M6 18h12v4H6z"/>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>欧盟标签打印</h1>
          <p>发货标签工作台</p>
        </div>
      </div>
      <div class="format-badge">100 × 150 mm</div>
    </div>
  </header>

  <main class="app-layout">
    <section class="panel control-panel" aria-labelledby="controlTitle">
      <h2 class="panel-title" id="controlTitle">标签设置</h2>

      <div class="field">
        <label class="field-label" for="modelInput">
          <span>Model Number</span>
          <span class="field-note">可输入或扫描</span>
        </label>
        <div class="input-shell">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <path d="M7 8v8"/>
            <path d="M10 8v8"/>
            <path d="M13 8v8"/>
            <path d="M17 8v8"/>
          </svg>
          <input class="text-input" id="modelInput" type="text" autocomplete="off" spellcheck="false" placeholder="输入 Model Number" autofocus>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="quantityInput">
          <span>标签数量</span>
          <span class="field-note">1–200</span>
        </label>
        <div class="stepper">
          <button class="icon-button" id="quantityMinus" type="button" aria-label="减少数量" title="减少数量">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14"/>
            </svg>
          </button>
          <input class="number-input" id="quantityInput" type="number" min="1" max="200" step="1" value="1" inputmode="numeric" aria-label="标签数量">
          <button class="icon-button" id="quantityPlus" type="button" aria-label="增加数量" title="增加数量">
            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14"/>
              <path d="M5 12h14"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="action-row">
        <button class="primary-button" id="printButton" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <path d="M6 9V2h12v7"/>
            <path d="M6 18h12v4H6z"/>
          </svg>
          <span>打印标签</span>
        </button>
        <button class="secondary-button" id="clearButton" type="button" aria-label="清空 Model Number" title="清空 Model Number">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"/>
            <path d="M8 6V4h8v2"/>
            <path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v5"/>
            <path d="M14 11v5"/>
          </svg>
        </button>
      </div>

      <button class="calibration-button" id="calibrationButton" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.3 8.7 8.7 21.3a1 1 0 0 1-1.4 0L2.7 16.7a1 1 0 0 1 0-1.4L15.3 2.7a1 1 0 0 1 1.4 0l4.6 4.6a1 1 0 0 1 0 1.4Z"/>
          <path d="m7.5 10.5 2 2"/>
          <path d="m10.5 7.5 2 2"/>
          <path d="m13.5 4.5 2 2"/>
          <path d="m4.5 13.5 2 2"/>
        </svg>
        <span>打印 100 × 150 校准页</span>
      </button>

      <hr class="divider">

      <div class="small-note">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4"/>
          <path d="M12 8h.01"/>
        </svg>
        <span>Model Number 留空时，标签上仅显示 Model Number:。</span>
      </div>
    </section>

    <section class="panel preview-panel" aria-labelledby="previewTitle">
      <div class="preview-heading">
        <div>
          <h2 id="previewTitle">标签预览</h2>
          <p>内容会同步到每一张标签</p>
        </div>
      </div>
      <div class="preview-board">
        <div class="preview-label label-frame">
          <div class="label" id="previewLabel"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="print-root" id="printRoot" aria-hidden="true"></div>
  <div class="calibration-root" id="calibrationRoot" aria-hidden="true"></div>

  <script>

      var BASE_FONT_CQW = 2.8663;
      var MIN_FONT_CQW = 1.55;
      var MODEL_TOP_BASE_CQW = 7.393;
      var FONT_ASCENT_RATIO = 1.06;

      var LABEL_CONTENT_HTML =
        '<img class="label-template-image" src="' + TEMPLATE_DATA_URI + '" alt="">' +
        '<div class="label-line line-product-name">Product Name: Portable Monitor</div>' +
        '<div class="label-line model-line"><span>Model Number: </span><span class="model-value"></span></div>' +
        '<div class="label-line line-input">Input: 200-240V~, 50/60Hz, 150W</div>' +
        '<div class="label-line line-manufacturer-1">Manufacturer: Shenzhen Test Display </div>' +
        '<div class="label-line line-manufacturer-2">Technology Co., Ltd</div>' +
        '<div class="label-line line-address-1">Address: A609, Jieshun Technology Center, No.</div>' +
        '<div class="label-line line-address-2"> 5 Guansheng 2nd Road, Luhu Community, </div>' +
        '<div class="label-line line-address-3">Guanhu Street, Longhua District, Shenzhen City</div>' +
        '<div class="label-line line-address-4">, Guangdong Province, China.</div>' +
        '<div class="label-line line-phone">+86 13977592976</div>' +
        '<div class="label-line line-eu-1">EU Representative: VAT SPEED SL</div>' +
        '<div class="label-line line-eu-2">Address: Calle Antonio Salvador N99.1,28026 </div>' +
        '<div class="label-line line-eu-3">Madrid,Spain.</div>' +
        '<div class="label-line line-email">services@vatspeed-eu.com</div>' +
        '<div class="label-line line-made-in-china">Made in China</div>';

      var modelInput = document.getElementById("modelInput");
      var quantityInput = document.getElementById("quantityInput");
      var quantityMinus = document.getElementById("quantityMinus");
      var quantityPlus = document.getElementById("quantityPlus");
      var printButton = document.getElementById("printButton");
      var calibrationButton = document.getElementById("calibrationButton");
      var clearButton = document.getElementById("clearButton");
      var previewLabel = document.getElementById("previewLabel");
      var printRoot = document.getElementById("printRoot");
      var calibrationRoot = document.getElementById("calibrationRoot");
      var modelFontSize = BASE_FONT_CQW;

      previewLabel.innerHTML = LABEL_CONTENT_HTML;

      var previewModelLine = previewLabel.querySelector(".model-line");
      var previewModelValue = previewLabel.querySelector(".model-value");

      function clampQuantity(value) {
        var parsed = parseInt(value, 10);
        if (!isFinite(parsed)) {
          parsed = 1;
        }
        return Math.min(200, Math.max(1, parsed));
      }

      function getModel() {
        return modelInput.value.trim();
      }

      function syncQuantity(value) {
        var quantity = clampQuantity(value);
        quantityInput.value = String(quantity);
        return quantity;
      }

      function syncModelFontVariables(labelElement) {
        var modelTop =
          MODEL_TOP_BASE_CQW + FONT_ASCENT_RATIO * (BASE_FONT_CQW - modelFontSize);

        labelElement.style.setProperty("--model-font-size", modelFontSize + "cqw");
        labelElement.style.setProperty("--model-top", modelTop + "cqw");
      }

      function fitModelToLine() {
        modelFontSize = BASE_FONT_CQW;
        syncModelFontVariables(previewLabel);

        while (
          previewModelLine.scrollWidth > previewModelLine.clientWidth &&
          modelFontSize > MIN_FONT_CQW
        ) {
          modelFontSize = Math.max(MIN_FONT_CQW, modelFontSize - 0.04);
          syncModelFontVariables(previewLabel);
        }

        document.querySelectorAll(".label").forEach(function (labelElement) {
          syncModelFontVariables(labelElement);
        });
      }

      function updatePreview() {
        previewModelValue.textContent = getModel();
        fitModelToLine();
      }

      function buildPrintLabels() {
        var quantity = syncQuantity(quantityInput.value);
        var model = getModel();
        var oneLabel =
          '<div class="print-label label-frame"><div class="label">' +
          LABEL_CONTENT_HTML +
          "</div></div>";

        printRoot.innerHTML = new Array(quantity + 1).join(oneLabel);
        printRoot.querySelectorAll(".model-value").forEach(function (element) {
          element.textContent = model;
        });
        printRoot.querySelectorAll(".label").forEach(syncModelFontVariables);
      }

      function printLabels() {
        document.body.classList.remove("calibration-mode");
        updatePreview();
        buildPrintLabels();
        window.print();
      }

      function buildCalibrationPage() {
        var ticks = [];

        for (var value = 5; value <= 145; value += 5) {
          var top = value;
          var isMajor = value % 10 === 0;
          var tickClass = "calibration-tick" + (isMajor ? " major" : "");
          var labelClass = "calibration-tick-label";
          var showLabel = isMajor && value !== 100;
          var label = showLabel ? '<span class="' + labelClass + '" style="top:' + top + 'mm">' + value + '</span>' : "";
          var rightLabel = showLabel ? '<span class="' + labelClass + ' right" style="top:' + top + 'mm">' + value + '</span>' : "";

          ticks.push('<span class="' + tickClass + '" style="top:' + top + 'mm"></span>');
          ticks.push('<span class="' + tickClass + ' right" style="top:' + top + 'mm"></span>');
          ticks.push(label);
          ticks.push(rightLabel);
        }

        calibrationRoot.innerHTML =
          '<div class="calibration-page">' +
            '<div class="calibration-frame"></div>' +
            '<div class="calibration-size-box"><span>10 mm</span></div>' +
            '<div class="calibration-title">100 × 150 mm<br>打印校准页</div>' +
            '<div class="calibration-subtitle">纸张 100 × 150 mm · 缩放 100% · 无边距<br>量一下黑色方框外沿，应为 10 × 10 mm</div>' +
            ticks.join("") +
            '<div class="calibration-cutoff"><span>100 mm</span></div>' +
            '<div class="calibration-end">标尺应到达纸张底边 · 页面高度 150 mm</div>' +
          "</div>";
      }

      function printCalibration() {
        document.body.classList.add("calibration-mode");
        buildCalibrationPage();
        window.print();
      }

      window.addEventListener("beforeprint", function () {
        if (document.body.classList.contains("calibration-mode")) {
          return;
        }
        updatePreview();
        buildPrintLabels();
      });

      window.addEventListener("afterprint", function () {
        document.body.classList.remove("calibration-mode");
      });

      modelInput.addEventListener("input", updatePreview);

      modelInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          quantityInput.focus();
          quantityInput.select();
        }
      });

      quantityInput.addEventListener("input", function () {
        syncQuantity(quantityInput.value);
      });

      quantityInput.addEventListener("blur", function () {
        syncQuantity(quantityInput.value);
      });

      quantityMinus.addEventListener("click", function () {
        syncQuantity(syncQuantity(quantityInput.value) - 1);
      });

      quantityPlus.addEventListener("click", function () {
        syncQuantity(syncQuantity(quantityInput.value) + 1);
      });

      clearButton.addEventListener("click", function () {
        modelInput.value = "";
        updatePreview();
        modelInput.focus();
      });

      printButton.addEventListener("click", printLabels);
      calibrationButton.addEventListener("click", printCalibration);

      document.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "p") {
          event.preventDefault();
          printLabels();
        }
      });

      updatePreview();
    }());
  </script>
